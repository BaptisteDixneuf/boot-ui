name: Temporary journal admission comparison

on:
  push:
    branches: [jdubois-performance-budget-research]
    paths: [.github/workflows/journal-performance-comparison.yml]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASELINE: c9282079aee3c0e2458e651b93ae9c58c3a255b7
      MAVEN_OPTS: >-
        -XX:ActiveProcessorCount=4 -Xmx768m
        -Daether.transport.http.connectTimeout=30000
        -Daether.transport.http.requestTimeout=120000
        -Daether.transport.http.retryHandler.count=5
        -Daether.transport.http.retryHandler.interval=10000
        -Daether.transport.http.retryHandler.intervalMax=60000
        -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504
    steps:
      - name: Check out the frozen candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare immutable source and dependency manifests
        run: |
          set -euo pipefail
          mkdir -p comparison/evidence "$RUNNER_TEMP/journal-baseline"
          git archive "$BASELINE" | tar -x -C "$RUNNER_TEMP/journal-baseline"
          git rev-parse HEAD HEAD^{tree} > comparison/evidence/candidate-source.txt
          git rev-parse "$BASELINE" "$BASELINE^{tree}" > comparison/evidence/baseline-source.txt
          java -version 2> comparison/evidence/java.txt
          lscpu > comparison/evidence/cpu.txt
          processors="$(getconf _NPROCESSORS_ONLN)"
          test "$processors" -ge 4
          printf '%s\n' "$processors" > comparison/evidence/host-processors.txt
          git diff --binary "$BASELINE" HEAD > comparison/evidence/candidate.patch
          git diff --exit-code "$BASELINE" HEAD -- '**/pom.xml' '**/package-lock.json' '**/package.json' .mvn
      - name: Build the baseline serially
        working-directory: ${{ runner.temp }}/journal-baseline
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/baseline-m2" -pl bootui-spring-sample-app -am -DskipTests install > "$GITHUB_WORKSPACE/comparison/evidence/baseline-build.log" 2>&1
          cp bootui-spring-sample-app/target/bootui-spring-sample-app-1.21.0.jar "$GITHUB_WORKSPACE/comparison/baseline.jar"
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/baseline-m2" -pl bootui-spring-sample-app dependency:tree -DoutputFile="$GITHUB_WORKSPACE/comparison/evidence/baseline-dependencies.txt"
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/baseline-m2" -pl bootui-spring-sample-app help:effective-pom -Doutput="$GITHUB_WORKSPACE/comparison/evidence/baseline-effective-pom.xml"
      - name: Build the candidate serially
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/candidate-m2" -pl bootui-spring-sample-app -am -DskipTests install > comparison/evidence/candidate-build.log 2>&1
          cp bootui-spring-sample-app/target/bootui-spring-sample-app-1.21.0.jar comparison/candidate.jar
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/candidate-m2" -pl bootui-spring-sample-app dependency:tree -DoutputFile="$GITHUB_WORKSPACE/comparison/evidence/candidate-dependencies.txt"
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/candidate-m2" -pl bootui-spring-sample-app help:effective-pom -Doutput="$GITHUB_WORKSPACE/comparison/evidence/candidate-effective-pom.xml"
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/candidate-m2" -pl bootui-spring-sample-app dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile="$GITHUB_WORKSPACE/comparison/classpath.txt"
          python3 -B .github/scripts/journal-comparison/verify_inputs.py comparison/baseline.jar comparison/candidate.jar comparison/evidence/package-manifest.json
      - name: Run the direct paired comparison
        run: |
          set -euo pipefail
          cp="bootui-spring-sample-app/target/test-classes:bootui-spring-sample-app/target/classes:$(cat comparison/classpath.txt)"
          mkdir -p comparison/classes
          javac --release 17 -cp "$cp" -d comparison/classes .github/scripts/journal-comparison/JournalPerformanceComparison.java
          java -XX:ActiveProcessorCount=4 -Xmx768m -cp "comparison/classes:$cp" io.github.jdubois.bootui.sample.JournalPerformanceComparison "$GITHUB_WORKSPACE/comparison/baseline.jar" "$GITHUB_WORKSPACE/comparison/candidate.jar" "$GITHUB_WORKSPACE/comparison/evidence" > comparison/evidence/standalone.log 2>&1
      - name: Preserve raw measurements and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-admission-direct-comparison
          path: |
            comparison/evidence/
            target/executable-jar/journal-direct-*/sample.log
          if-no-files-found: error
          retention-days: 14
