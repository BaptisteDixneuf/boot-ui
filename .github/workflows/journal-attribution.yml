name: Temporary baseline journal attribution

on:
  push:
    branches: [jdubois-performance-budget-research]
    paths: [.github/workflows/journal-attribution.yml]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE: c9282079aee3c0e2458e651b93ae9c58c3a255b7
      MAVEN_OPTS: >-
        -XX:ActiveProcessorCount=4 -Xmx768m
        -Daether.transport.http.connectTimeout=30000
        -Daether.transport.http.requestTimeout=120000
        -Daether.transport.http.retryHandler.count=5
        -Daether.transport.http.retryHandler.interval=10000
        -Daether.transport.http.retryHandler.intervalMax=60000
        -Daether.transport.http.retryHandler.serviceUnavailable=429,500,502,503,504
    steps:
      - name: Check out only the temporary driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare immutable baseline and physical CPU evidence
        run: |
          set -euo pipefail
          mkdir -p attribution/evidence "$RUNNER_TEMP/journal-profile-baseline"
          git archive "$BASELINE" | tar -x -C "$RUNNER_TEMP/journal-profile-baseline"
          git rev-parse HEAD HEAD^{tree} > attribution/evidence/driver-source.txt
          git rev-parse "$BASELINE" "$BASELINE^{tree}" > attribution/evidence/application-source.txt
          test "$(getconf _NPROCESSORS_ONLN)" -ge 4
          lscpu > attribution/evidence/cpu.txt
          java -version 2> attribution/evidence/java.txt
          cp "$JAVA_HOME/lib/jfr/profile.jfc" attribution/evidence/profile.jfc
          python3 -B .github/scripts/journal-profile/safe_settings.py attribution/evidence/profile.jfc attribution/evidence/safe-profile.jfc > attribution/evidence/settings-build.log
      - name: Build and verify only the frozen baseline
        working-directory: ${{ runner.temp }}/journal-profile-baseline
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/journal-profile-m2" -pl bootui-spring-sample-app -am -DskipTests install > "$GITHUB_WORKSPACE/attribution/evidence/build.log" 2>&1
          ./mvnw -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/journal-profile-m2" -pl bootui-spring-sample-app dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile="$GITHUB_WORKSPACE/attribution/classpath.txt"
          cp bootui-spring-sample-app/target/bootui-spring-sample-app-1.21.0.jar "$GITHUB_WORKSPACE/attribution/baseline.jar"
          python3 -B "$GITHUB_WORKSPACE/.github/scripts/journal-profile/verify_baseline.py" "$GITHUB_WORKSPACE/attribution/baseline.jar" "$GITHUB_WORKSPACE/.github/scripts/journal-profile/expected-baseline.json" "$GITHUB_WORKSPACE/attribution/evidence/package-manifest.json"
      - name: Collect the single bounded baseline recording
        working-directory: ${{ runner.temp }}/journal-profile-baseline
        run: |
          set -euo pipefail
          cp="bootui-spring-sample-app/target/test-classes:bootui-spring-sample-app/target/classes:$(cat "$GITHUB_WORKSPACE/attribution/classpath.txt")"
          mkdir -p "$GITHUB_WORKSPACE/attribution/classes"
          javac --release 17 -cp "$cp" -d "$GITHUB_WORKSPACE/attribution/classes" "$GITHUB_WORKSPACE/.github/scripts/journal-profile/JournalAttribution.java"
          java -XX:ActiveProcessorCount=4 -Xmx768m -cp "$GITHUB_WORKSPACE/attribution/classes:$cp" io.github.jdubois.bootui.sample.JournalAttribution "$GITHUB_WORKSPACE/attribution/baseline.jar" "$GITHUB_WORKSPACE/attribution/evidence" > "$GITHUB_WORKSPACE/attribution/evidence/standalone.log" 2>&1
          cp target/executable-jar/journal-profile-baseline/sample.log "$GITHUB_WORKSPACE/attribution/evidence/application.log"
      - name: Preserve sampled event JSON and attribution
        run: |
          set -euo pipefail
          "$JAVA_HOME/bin/jfr" print --json --events jdk.ExecutionSample,jdk.ObjectAllocationSample,jdk.ThreadPark attribution/evidence/runtime.jfr > attribution/evidence/raw-events.json
          python3 -B .github/scripts/journal-profile/analyze.py attribution/evidence/raw-events.json attribution/evidence/attribution.json
      - name: Preserve recording, controls and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journal-baseline-jfr-attribution
          path: attribution/evidence/
          if-no-files-found: error
          retention-days: 14
